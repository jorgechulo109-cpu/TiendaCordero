name: Crear APK Tienda Cordero

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - - name: Compilar APK
        working-directory: TiendaCordero_ParaCrearAPK/TiendaCordero
        run: gradle --no-daemon assembleDebug
        

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TiendaCordero-APK
          path: TiendaCordero_ParaCrearAPK/TiendaCordero/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
